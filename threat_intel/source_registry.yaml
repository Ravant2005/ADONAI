research_datasets:
- dataset_id: cic-ids2017
  name: CIC-IDS2017 Intrusion Detection Dataset
  provider: Canadian Institute for Cybersecurity (UNB)
  license: Public Research Use with Citation
  collection_window: "July 3\u20137, 2017 (5 days)"
  feature_schema: 80 network flow features (CICFlowMeter) + benign/attack labels
  class_imbalance: High (~80% Benign, <0.01% Heartbleed/Infiltration)
  known_issues: TCP session termination artifacts inCICFlowMeter; requires payload-free
    flow normalization
  split_methodology: Time-separated by capture day and source host IP to prevent campaign
    leakage
  raw_binaries_included: false
  safe_handling: Flow metadata CSVs and benign PCAP slices only; no exploit payloads
    executed
- dataset_id: cse-cic-ids2018
  name: CSE-CIC-IDS2018 on AWS
  provider: Communications Security Establishment & UNB
  license: Public Research Use
  collection_window: "February\u2013March 2018"
  feature_schema: 80 flow features + system logs across 5 subnets
  class_imbalance: High (~83% Benign across 16.2M flows)
  known_issues: Timestamp formatting variances across days; duplicate header rows
    in raw CSVs
  split_methodology: Strict subnet-separated and date-separated split
  raw_binaries_included: false
  safe_handling: Aggregated flow features only
- dataset_id: ctu-13
  name: CTU-13 Botnet Traffic Dataset
  provider: Czech Technical University in Prague (Stratosphere Lab)
  license: CC BY 4.0
  collection_window: 2011 (13 distinct scenarios)
  feature_schema: Bidirectional NetFlow (StartTime, Dur, Proto, SrcAddr, DstAddr,
    State, TotPkts, TotBytes, Label)
  class_imbalance: "Background traffic >95%, Botnet C2 flows ~1.5\u20133%"
  known_issues: Background traffic contains unlabeled opportunistic scans
  split_methodology: Scenario-separated split (Scenarios 1,2,6,8,9 train; Scenarios
    3,4,5,7,10,11,12,13 test)
  raw_binaries_included: false
  safe_handling: Use NetFlow `.binetflow` summaries; never run historical botnet executables
- dataset_id: unsw-nb15
  name: UNSW-NB15 Network Intrusion Dataset
  provider: UNSW Canberra Cyber Range Lab
  license: Academic & Research Use with Attribution
  collection_window: "January\u2013February 2015"
  feature_schema: 49 features (Argus/Bro-IDS + 12 syntactic/flow algorithms)
  class_imbalance: 87.3% Normal, 12.7% across 9 attack families
  known_issues: TTL and window size artifacts between IXIA PerfectStorm synthetic
    generator and normal traffic
  split_methodology: Time-window split avoiding random row shuffle across identical
    5-tuple sessions
  raw_binaries_included: false
  safe_handling: Tabular feature vectors only
- dataset_id: bot-iot
  name: Bot-IoT Dataset
  provider: UNSW Canberra
  license: Research Use Permitted with Citation
  collection_window: '2018'
  feature_schema: 46 network flow & IoT MQTT/telemetry attributes
  class_imbalance: Extreme (>99% DDoS/Scan in full set; requires stratified sampling)
  known_issues: Synthetic flood volume dominates unless downsampled by time window
  split_methodology: Device-ID and time-window separated evaluation
  raw_binaries_included: false
  safe_handling: Flow metadata only
- dataset_id: stratosphere-ips
  name: Stratosphere Lab Malware & Benign Captures
  provider: Stratosphere Laboratory (AIC Group, FEL CVUT)
  license: CC BY-SA 4.0
  collection_window: "2013\u20132025 continuous"
  feature_schema: Zeek conn.log / dns.log / ssl.log behavioral letters
  class_imbalance: Balanced per capture profile
  known_issues: Expired domains in historical captures may now be sinkholed or parked
  split_methodology: Capture-UUID separated split
  raw_binaries_included: false
  safe_handling: Zeek log replay only; binaries excluded
- dataset_id: open-phishing-corpus
  name: Curated Open Phishing & Benign URL Benchmark
  provider: PhishTank / URLhaus / Tranco Top-1M Benign Baseline
  license: CC0 / Public Research
  collection_window: "2025\u20132026"
  feature_schema: URL lexical features, TLD risk, homograph distance, credential token
    presence
  class_imbalance: Calibrated 10:1 Benign-to-Phishing evaluation ratio
  known_issues: "Ephemeral phishing domains expire within 48\u201372 hours"
  split_methodology: Registrable-domain disjoint split + temporal cutoff
  raw_binaries_included: false
  safe_handling: Defanged lexical string evaluation; never auto-fetch live phishing
    pages from client devices
